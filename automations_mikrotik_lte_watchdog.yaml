# ============================================================================
# automations_mikrotik_lte_watchdog.yaml
#
# Добавить эти автоматизации в automations.yaml (или импортировать через
# Настройки -> Автоматизации -> три точки -> Редактировать в YAML -> вставить
# каждую по отдельности).
#
# ТРЕБУЕМЫЕ ENTITY_ID (проверьте фактические имена у себя, если названия
# loss/delay для LTE-шлюза отличаются от приведённого шаблона):
#   sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status
#   sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_loss
#   sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_delay
#   sensor.fw_village_qtronix_ru_gateway_wan_dhcp_status
#   sensor.fw_village_qtronix_ru_gateway_wan_dhcp_loss
#   sensor.fw_village_qtronix_ru_gateway_wan_dhcp_delay
#
# МЕСТА ПРАВКИ ИНТЕРВАЛОВ (нельзя вынести в input_number, т.к. Home Assistant
# не поддерживает шаблоны в trigger.time_pattern):
#   - Автоматизация 1: trigger time_pattern minutes: "/5"  -> периодичность
#     проверки на предупреждения (по умолчанию раз в 5 минут)
#   - Автоматизация 2: trigger time_pattern minutes: "/1"  -> периодичность
#     проверки на необходимость перезагрузки (по умолчанию раз в 1 минуту,
#     чтобы точнее ловить момент достижения Y минут в down)
#
# Все остальные пороги (X, Y, Z, cooldown, лимит перезагрузок) регулируются
# через input_number из helpers.yaml прямо в интерфейсе HA.
# ============================================================================

automation:

  # ==========================================================================
  # 1. WARNING MONITOR
  # Раз в N минут проверяет оба шлюза группы LTE_1. Если статус down ИЛИ
  # packet_loss > X% - шлёт предупреждение в Telegram, но не чаще, чем раз в
  # "mikrotik_atlgm_lte_watchdog_warning_repeat_minutes", пока проблема не исчезнет.
  # ==========================================================================
  - id: mikrotik_atlgm_lte_watchdog_warning_monitor
    alias: "LTE Watchdog: мониторинг шлюзов (warning)"
    description: >-
      Периодически проверяет WAN_LTE_MIKROTIK_DHCP и WAN_DHCP из группы
      LTE_1 на статус down или превышение порога packet loss, шлёт
      предупреждение в Telegram.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"          # <-- периодичность проверки, правьте здесь
    variables:
      loss_threshold: "{{ states('input_number.mikrotik_atlgm_lte_watchdog_packet_loss_threshold') | float(20) }}"
      repeat_minutes: "{{ states('input_number.mikrotik_atlgm_lte_watchdog_warning_repeat_minutes') | float(30) }}"
      status_lte: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') }}"
      status_dhcp: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_dhcp_status') }}"
      loss_lte: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_loss') | float(0) }}"
      loss_dhcp: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_dhcp_loss') | float(0) }}"
      delay_lte: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_delay') }}"
      delay_dhcp: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_dhcp_delay') }}"
      problem_lte: >-
        {{ status_lte not in ['unknown','unavailable', None]
           and (status_lte == 'down' or loss_lte > loss_threshold) }}
      problem_dhcp: >-
        {{ status_dhcp not in ['unknown','unavailable', None]
           and (status_dhcp == 'down' or loss_dhcp > loss_threshold) }}
      any_problem: "{{ problem_lte or problem_dhcp }}"
      minutes_since_last_warning: >-
        {% set last = states('input_datetime.mikrotik_atlgm_lte_last_warning') %}
        {% if last in ['unknown','unavailable', None, ''] %}
          999999
        {% else %}
          {{ ((now() - (last | as_datetime)).total_seconds() / 60) | round(1) }}
        {% endif %}
    condition:
      - condition: template
        value_template: >-
          {{ any_problem and (minutes_since_last_warning | float >= repeat_minutes) }}
    action:
      - action: system_log.write
        data:
          message: >-
            [mikrotik_atlgm_lte_watchdog] WARNING: LTE(status={{ status_lte }},
            loss={{ loss_lte }}%, delay={{ delay_lte }}ms)
            DHCP(status={{ status_dhcp }}, loss={{ loss_dhcp }}%,
            delay={{ delay_dhcp }}ms) threshold={{ loss_threshold }}%
          level: warning
          logger: custom.mikrotik_atlgm_lte_watchdog

      - condition: template
        value_template: "{{ not is_state('input_boolean.mikrotik_atlgm_lte_watchdog_alert_silenced', 'on') }}"

      - action: telegram_bot.send_message
        data:
          target: !secret telegram_chat_id
          message: >-
            ⚠️ *LTE_1: обнаружена проблема со шлюзом*

            {% if problem_lte -%}
            🔴 *WAN_LTE_MIKROTIK_DHCP* (Tier 1, через MikroTik ATL LTE18)
            Статус: `{{ status_lte }}`
            Packet Loss: {{ loss_lte }}% (порог {{ loss_threshold }}%)
            Latency: {{ delay_lte }} ms
            {% endif %}
            {% if problem_dhcp -%}
            🔴 *WAN_DHCP* (Tier 2)
            Статус: `{{ status_dhcp }}`
            Packet Loss: {{ loss_dhcp }}% (порог {{ loss_threshold }}%)
            Latency: {{ delay_dhcp }} ms
            {% endif %}

            Действие: только мониторинг.
            {% if problem_lte and status_lte == 'down' -%}
            Если WAN_LTE_MIKROTIK_DHCP останется в down дольше
            {{ states('input_number.mikrotik_atlgm_lte_watchdog_down_minutes_before_reboot') }} мин
            - будет выполнена автоматическая перезагрузка MikroTik.
            {% endif %}

            Отключить тревогу на 1 час: /mikrotik_silence
          parse_mode: markdown

      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.mikrotik_atlgm_lte_last_warning
        data:
          timestamp: "{{ now().timestamp() }}"

  # ==========================================================================
  # 2. AUTO-REBOOT WATCHER
  # Раз в 1 минуту проверяет, сколько времени WAN_LTE_MIKROTIK_DHCP находится
  # в down. Если >= Y минут, и соблюдены условия anti-flapping (cooldown,
  # дневной лимит, не silenced) - выполняет перезагрузку MikroTik через
  # button.qtronixlte_restart (интеграция mikrotik), ждёт Z минут и проверяет
  # восстановление.
  # ==========================================================================
  - id: mikrotik_atlgm_lte_watchdog_auto_reboot
    alias: "LTE Watchdog: авто-перезагрузка MikroTik"
    description: >-
      Перезагружает MikroTik ATL LTE18 через button.qtronixlte_restart
      (интеграция mikrotik), если WAN_LTE_MIKROTIK_DHCP
      находится в down дольше заданного времени, с защитой от частых
      перезагрузок (cooldown + дневной лимит).
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/1"          # <-- периодичность проверки, правьте здесь
    variables:
      down_threshold_minutes: "{{ states('input_number.mikrotik_atlgm_lte_watchdog_down_minutes_before_reboot') | float(10) }}"
      cooldown_minutes: "{{ states('input_number.mikrotik_atlgm_lte_watchdog_reboot_cooldown_minutes') | float(30) }}"
      max_reboots: "{{ states('input_number.mikrotik_atlgm_lte_watchdog_max_reboots_per_day') | int(3) }}"
      post_reboot_wait_minutes: "{{ states('input_number.mikrotik_atlgm_lte_watchdog_post_reboot_wait_minutes') | int(5) }}"
      reboot_count_today: "{{ states('input_number.mikrotik_atlgm_lte_reboot_count_today') | int(0) }}"
      status_lte: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') }}"
      down_duration_minutes: >-
        {% set ent = states.sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status %}
        {% if ent is not none and ent.state == 'down' and ent.last_changed is not none %}
          {{ ((now() - ent.last_changed).total_seconds() / 60) | round(1) }}
        {% else %}
          0
        {% endif %}
      minutes_since_last_reboot: >-
        {% set last = states('input_datetime.mikrotik_atlgm_lte_last_reboot') %}
        {% if last in ['unknown','unavailable', None, ''] %}
          999999
        {% else %}
          {{ ((now() - (last | as_datetime)).total_seconds() / 60) | round(1) }}
        {% endif %}
    condition:
      - condition: template
        value_template: >-
          {{ status_lte == 'down'
             and down_duration_minutes | float >= down_threshold_minutes
             and minutes_since_last_reboot | float >= cooldown_minutes
             and reboot_count_today < max_reboots
             and not is_state('input_boolean.mikrotik_atlgm_lte_watchdog_alert_silenced', 'on') }}
    action:
      - action: system_log.write
        data:
          message: >-
            [mikrotik_atlgm_lte_watchdog] REBOOT TRIGGERED: down_duration={{ down_duration_minutes }}min
            (threshold {{ down_threshold_minutes }}min), reboot_count_today={{ reboot_count_today }}/{{ max_reboots }}
          level: warning
          logger: custom.mikrotik_atlgm_lte_watchdog

      - action: telegram_bot.send_message
        data:
          target: !secret telegram_chat_id
          message: >-
            🚨 *WAN_LTE_MIKROTIK_DHCP в down {{ down_duration_minutes }} мин*
            Выполняю перезагрузку MikroTik ATL LTE18 (192.168.188.1)...
            Перезагрузка №{{ reboot_count_today + 1 }} из {{ max_reboots }} на сегодня.
          parse_mode: markdown

      # --- Собственно перезагрузка: штатная кнопка интеграции mikrotik ---
      - action: button.press
        target:
          entity_id: button.qtronixlte_restart
        data: {}

      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.mikrotik_atlgm_lte_last_reboot
        data:
          timestamp: "{{ now().timestamp() }}"

      - action: input_number.set_value
        target:
          entity_id: input_number.mikrotik_atlgm_lte_reboot_count_today
        data:
          value: "{{ reboot_count_today + 1 }}"

      # --- Пауза Z минут перед проверкой восстановления ---
      - delay:
          minutes: "{{ post_reboot_wait_minutes }}"

      - action: system_log.write
        data:
          message: >-
            [mikrotik_atlgm_lte_watchdog] Post-reboot check: status={{
            states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') }}
          level: info
          logger: custom.mikrotik_atlgm_lte_watchdog

      - choose:
          # Шлюз поднялся -> сообщение о восстановлении
          - conditions:
              - condition: template
                value_template: >-
                  {{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') != 'down' }}
            sequence:
              - action: telegram_bot.send_message
                data:
                  target: !secret telegram_chat_id
                  message: >-
                    ✅ WAN_LTE_MIKROTIK_DHCP восстановлен после перезагрузки MikroTik.
                    Текущий статус: `{{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') }}`
                  parse_mode: markdown
        # Шлюз всё ещё down -> критическое уведомление
        default:
          - action: telegram_bot.send_message
            data:
              target: !secret telegram_chat_id
              message: >-
                ❌ *КРИТИЧНО*: WAN_LTE_MIKROTIK_DHCP всё ещё `down` через
                {{ post_reboot_wait_minutes }} мин после перезагрузки MikroTik.
                Похоже на проблему провайдера / SIM / антенны, а не на
                зависание роутера. Дальнейшие авто-перезагрузки ограничены
                cooldown ({{ cooldown_minutes }} мин) и дневным лимитом
                ({{ max_reboots }}). Требуется ручная проверка.
              parse_mode: markdown

  # ==========================================================================
  # 3. CIRCUIT BREAKER
  # Если дневной лимит перезагрузок исчерпан, а шлюз всё ещё down - шлём
  # ОДНО дополнительное критическое уведомление (не спамим каждую минуту)
  # о вероятной проблеме на стороне провайдера.
  # ==========================================================================
  - id: mikrotik_atlgm_lte_watchdog_circuit_breaker
    alias: "LTE Watchdog: лимит перезагрузок исчерпан"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: template
        value_template: >-
          {{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') == 'down'
             and states('input_number.mikrotik_atlgm_lte_reboot_count_today') | int(0)
                 >= states('input_number.mikrotik_atlgm_lte_watchdog_max_reboots_per_day') | int(3)
             and not is_state('input_boolean.mikrotik_atlgm_lte_watchdog_circuit_breaker_notified', 'on') }}
    action:
      - action: system_log.write
        data:
          message: "[mikrotik_atlgm_lte_watchdog] Circuit breaker: дневной лимит перезагрузок исчерпан"
          level: error
          logger: custom.mikrotik_atlgm_lte_watchdog
      - action: telegram_bot.send_message
        data:
          target: !secret telegram_chat_id
          message: >-
            🛑 *LTE Watchdog: авто-перезагрузки приостановлены*
            Достигнут суточный лимит перезагрузок MikroTik
            ({{ states('input_number.mikrotik_atlgm_lte_watchdog_max_reboots_per_day') }}),
            а WAN_LTE_MIKROTIK_DHCP всё ещё down.
            Вероятная причина: авария/блокировка на стороне оператора связи,
            а не зависание роутера (например, неоплата SIM).
            Дальнейшие авто-перезагрузки не выполняются до 00:00 или до
            ручного сброса через /mikrotik_reset.
          parse_mode: markdown
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_circuit_breaker_notified

  # ==========================================================================
  # 4. ЕЖЕСУТОЧНЫЙ СБРОС СЧЁТЧИКА
  # ==========================================================================
  - id: mikrotik_atlgm_lte_watchdog_daily_reset
    alias: "LTE Watchdog: сброс счётчика перезагрузок в 00:00"
    mode: single
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - action: input_number.set_value
        target:
          entity_id: input_number.mikrotik_atlgm_lte_reboot_count_today
        data:
          value: 0
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_circuit_breaker_notified
      - action: system_log.write
        data:
          message: "[mikrotik_atlgm_lte_watchdog] Суточный счётчик перезагрузок сброшен"
          level: info
          logger: custom.mikrotik_atlgm_lte_watchdog

  # ==========================================================================
  # 5. РУЧНОЕ УПРАВЛЕНИЕ ЧЕРЕЗ TELEGRAM-КОМАНДЫ
  # Требует, чтобы бот был добавлен в allowed_chat_ids и подписан на команды.
  # /mikrotik_silence  - отключить уведомления и авто-reboot на 1 час
  # /mikrotik_reset    - снять silence, сбросить дневной счётчик и circuit breaker
  # ==========================================================================
  - id: mikrotik_atlgm_lte_watchdog_telegram_silence
    alias: "LTE Watchdog: Telegram /mikrotik_silence"
    mode: single
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: "/mikrotik_silence"
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_alert_silenced
      - action: telegram_bot.send_message
        data:
          target: !secret telegram_chat_id
          message: "🔕 Уведомления и авто-перезагрузка MikroTik отключены на 1 час."
      - delay:
          hours: 1
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_alert_silenced
      - action: telegram_bot.send_message
        data:
          target: !secret telegram_chat_id
          message: "🔔 Watchdog снова активен."

  - id: mikrotik_atlgm_lte_watchdog_telegram_reset
    alias: "LTE Watchdog: Telegram /mikrotik_reset"
    mode: single
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: "/mikrotik_reset"
    action:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_alert_silenced
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_circuit_breaker_notified
      - action: input_number.set_value
        target:
          entity_id: input_number.mikrotik_atlgm_lte_reboot_count_today
        data:
          value: 0
      - action: telegram_bot.send_message
        data:
          target: !secret telegram_chat_id
          message: "♻️ Тревога и счётчик перезагрузок сброшены вручную."
