# ============================================================================
# automations_mikrotik_lte_watchdog.yaml
#
# Добавить эти автоматизации в automations.yaml (или импортировать через
# Настройки -> Автоматизации -> три точки -> Редактировать в YAML -> вставить
# каждую по отдельности).
#
# ТРЕБУЕМЫЕ ENTITY_ID (проверьте фактические имена у себя, если названия
# loss/delay для LTE-шлюза отличаются от приведённого шаблона):
#   sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status
#   sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_loss
#   sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_delay
#   sensor.fw_village_qtronix_ru_gateway_wan_dhcp_status
#   sensor.fw_village_qtronix_ru_gateway_wan_dhcp_loss
#   sensor.fw_village_qtronix_ru_gateway_wan_dhcp_delay
#
# МЕСТА ПРАВКИ ИНТЕРВАЛОВ (нельзя вынести в input_number, т.к. Home Assistant
# не поддерживает шаблоны в trigger.time_pattern):
#   - Автоматизация 1: trigger time_pattern minutes: "/5"  -> периодичность
#     проверки на предупреждения (по умолчанию раз в 5 минут)
#   - Автоматизация 2: trigger time_pattern minutes: "/1"  -> периодичность
#     проверки на необходимость перезагрузки (по умолчанию раз в 1 минуту,
#     чтобы точнее ловить момент достижения Y минут в down)
#
# Все остальные пороги (X, Y, Z, cooldown, лимит перезагрузок) регулируются
# через input_number из helpers.yaml прямо в интерфейсе HA.
# ============================================================================

automation:
  - id: mikrotik_atlgm_lte_watchdog_warning_monitor
    alias: "LTE Watchdog: мониторинг шлюзов (warning)"
    description: >-
      Периодически проверяет WAN_LTE_MIKROTIK_DHCP и WAN_DHCP из группы
      LTE_1 на статус down или превышение порога packet loss, шлёт
      предупреждение в Telegram и поддерживает LED-стадию online/degraded
      в актуальном состоянии (в т.ч. переводит обратно в online при
      самостоятельном восстановлении канала).
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"          # <-- периодичность проверки, правьте здесь
    variables:
      loss_threshold: "{{ states('input_number.mikrotik_atlgm_lte_watchdog_packet_loss_threshold') | float(20) }}"
      repeat_minutes: "{{ states('input_number.mikrotik_atlgm_lte_watchdog_warning_repeat_minutes') | float(30) }}"
      status_lte: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') }}"
      status_dhcp: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_dhcp_status') }}"
      loss_lte: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_loss') | float(0) }}"
      loss_dhcp: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_dhcp_loss') | float(0) }}"
      delay_lte: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_delay') }}"
      delay_dhcp: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_dhcp_delay') }}"
      problem_lte: >-
        {{ status_lte not in ['unknown','unavailable', None]
           and (status_lte == 'down' or loss_lte > loss_threshold) }}
      problem_dhcp: >-
        {{ status_dhcp not in ['unknown','unavailable', None]
           and (status_dhcp == 'down' or loss_dhcp > loss_threshold) }}
      any_problem: "{{ problem_lte or problem_dhcp }}"
      muted_active: >-
        {{ is_state('input_boolean.mikrotik_atlgm_lte_watchdog_alert_silenced', 'on')
           or is_state('input_boolean.mikrotik_atlgm_lte_watchdog_muted', 'on') }}
      current_stage: "{{ states('input_select.mikrotik_atlgm_lte_watchdog_stage') }}"
      minutes_since_last_warning: >-
        {% set last = states('input_datetime.mikrotik_atlgm_lte_last_warning') %}
        {% if last in ['unknown','unavailable', None, ''] %}
          999999
        {% else %}
          {{ ((as_timestamp(now()) - as_timestamp(last)) / 60) | round(1) }}
        {% endif %}
    action:
      - action: system_log.write
        data:
          message: >-
            [mikrotik_atlgm_lte_watchdog] STATUS: LTE(status={{ status_lte }},
            loss={{ loss_lte }}%, delay={{ delay_lte }}ms)
            DHCP(status={{ status_dhcp }}, loss={{ loss_dhcp }}%,
            delay={{ delay_dhcp }}ms) threshold={{ loss_threshold }}%
          level: info
          logger: custom.mikrotik_atlgm_lte_watchdog

      # --- Синхронизация LED-стадии online <-> degraded.
      # Стадии soft_reset/hard_reset/police управляются автоматизациями
      # auto_reboot/circuit_breaker/recovery_watch и здесь НЕ трогаются. ---
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ any_problem and current_stage == 'online' }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.mikrotik_atlgm_lte_watchdog_stage
                data:
                  option: degraded
          - conditions:
              - condition: template
                value_template: "{{ not any_problem and current_stage == 'degraded' }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.mikrotik_atlgm_lte_watchdog_stage
                data:
                  option: online

      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ any_problem and not muted_active
                     and minutes_since_last_warning | float >= repeat_minutes }}
            sequence:
              - action: telegram_bot.send_message
                data:
                  chat_id: !secret telegram_chat_id
                  message: >-
                    ⚠️ <b>LTE_1: обнаружена проблема со шлюзом</b>

                    {% if problem_lte -%}
                    🔴 <b>WAN_LTE_MIKROTIK_DHCP</b> (Tier 1, через MikroTik ATL LTE18)
                    Статус: <code>{{ status_lte }}</code>
                    Packet Loss: {{ loss_lte }}% (порог {{ loss_threshold }}%)
                    Latency: {{ delay_lte }} ms
                    {% endif %}
                    {% if problem_dhcp -%}
                    🔴 <b>WAN_DHCP</b> (Tier 2)
                    Статус: <code>{{ status_dhcp }}</code>
                    Packet Loss: {{ loss_dhcp }}% (порог {{ loss_threshold }}%)
                    Latency: {{ delay_dhcp }} ms
                    {% endif %}

                    Действие: только мониторинг.
                    {% if problem_lte and status_lte == 'down' -%}
                    Если WAN_LTE_MIKROTIK_DHCP останется в down дольше
                    {{ states('input_number.mikrotik_atlgm_lte_watchdog_down_minutes_before_reboot') }} мин
                    - будет выполнена автоматическая перезагрузка MikroTik.
                    {% endif %}

                    Отключить тревогу на 1 час: /mikrotik_silence
                    Отключить до восстановления: /mikrotik_mute
                  parse_mode: html
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.mikrotik_atlgm_lte_last_warning
                data:
                  timestamp: "{{ now().timestamp() }}"

  - id: mikrotik_atlgm_lte_watchdog_auto_reboot
    alias: "LTE Watchdog: авто-перезагрузка MikroTik"
    description: >-
      Эскалация: попытки 1-2 - софт-ребут через button.qtronixlte_restart
      (cooldown между ними - soft_reboot_cooldown_minutes). Начиная с
      попытки hard_reset_after_attempt - аппаратный обрыв питания через
      ESPHome button.mikrotik_atlgm_hard_power_cycle, с более долгим
      ожиданием восстановления и cooldown (hard_reset_post_wait_minutes).
      Останавливается по достижении max_reboots_per_day.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/1"          # <-- периодичность проверки, правьте здесь
    variables:
      down_threshold_minutes: "{{ states('input_number.mikrotik_atlgm_lte_watchdog_down_minutes_before_reboot') | float(10) }}"
      soft_cooldown_minutes: "{{ states('input_number.mikrotik_atlgm_lte_watchdog_soft_reboot_cooldown_minutes') | float(10) }}"
      hard_reset_after_attempt: "{{ states('input_number.mikrotik_atlgm_lte_watchdog_hard_reset_after_attempt') | int(3) }}"
      hard_post_wait_minutes: "{{ states('input_number.mikrotik_atlgm_lte_watchdog_hard_reset_post_wait_minutes') | float(30) }}"
      max_reboots: "{{ states('input_number.mikrotik_atlgm_lte_watchdog_max_reboots_per_day') | int(5) }}"
      post_reboot_wait_minutes: "{{ states('input_number.mikrotik_atlgm_lte_watchdog_post_reboot_wait_minutes') | int(5) }}"
      reboot_count_today: "{{ states('input_number.mikrotik_atlgm_lte_reboot_count_today') | int(0) }}"
      attempt_number: "{{ reboot_count_today + 1 }}"
      soft_button_unreachable: >-
        {{ states('button.qtronixlte_restart') in ['unavailable', 'unknown'] }}
      hard_button_unreachable: >-
        {{ states('button.mikrotik_atlgm_hard_power_cycle') in ['unavailable', 'unknown'] }}
      # Если софт-кнопка недоступна (интеграция mikrotik не отвечает) - нет
      # смысла тратить попытку на заведомо бесполезное нажатие в никуда,
      # сразу эскалируем на хард (если он доступен)
      is_hard_attempt: "{{ (attempt_number >= hard_reset_after_attempt) or soft_button_unreachable }}"
      last_was_hard: "{{ reboot_count_today >= hard_reset_after_attempt }}"
      # --- Эскалация длительности повторных ХАРД-ресетов ---
      # Иногда обрыва на 30-60 сек недостаточно (модем/вышка не успевают
      # "забыть" зависшую регистрацию) - тогда помогает более долгий обрыв.
      # 1-й хард-ресет (index=1) - короткий, по умолчанию 45 сек
      # (number.mikrotik_atlgm_hard_reset_duration).
      # 2-й (index=2) - 5 минут, 3-й (index=3) - 10 минут, и т.д.:
      # long_minutes = (index - 1) * 5.
      #
      # ВАЖНО: считаем ОТДЕЛЬНО для текущей попытки (сколько ждать ПОСЛЕ
      # неё перед проверкой) и для предыдущей (сколько уже нужно было
      # выждать с последнего ребута, чтобы cooldown не занижался).
      hard_attempt_index: "{{ attempt_number - hard_reset_after_attempt + 1 }}"
      hard_reset_long_minutes: >-
        {{ ((hard_attempt_index | int(1)) - 1) * 5 if is_hard_attempt and (hard_attempt_index | int(1)) >= 2 else 0 }}
      hard_wait_minutes: "{{ hard_post_wait_minutes + hard_reset_long_minutes }}"

      prev_hard_attempt_index: "{{ reboot_count_today - hard_reset_after_attempt + 1 }}"
      prev_hard_reset_long_minutes: >-
        {{ ((prev_hard_attempt_index | int(1)) - 1) * 5 if last_was_hard and (prev_hard_attempt_index | int(1)) >= 2 else 0 }}
      prev_hard_wait_minutes: "{{ hard_post_wait_minutes + prev_hard_reset_long_minutes }}"
      # Cooldown с момента ПРЕДЫДУЩЕЙ попытки зависит от того, какой она
      # была (софт или хард) и, если хард - какой длительности
      cooldown_minutes: "{{ prev_hard_wait_minutes if last_was_hard else soft_cooldown_minutes }}"
      status_lte: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') }}"
      down_duration_minutes: >-
        {% set ent = states.sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status %}
        {% if ent is not none and ent.state == 'down' and ent.last_changed is not none %}
          {{ ((as_timestamp(now()) - as_timestamp(ent.last_changed)) / 60) | round(1) }}
        {% else %}
          0
        {% endif %}
      minutes_since_last_reboot: >-
        {% set last = states('input_datetime.mikrotik_atlgm_lte_last_reboot') %}
        {% if last in ['unknown','unavailable', None, ''] %}
          999999
        {% else %}
          {{ ((as_timestamp(now()) - as_timestamp(last)) / 60) | round(1) }}
        {% endif %}
    condition:
      - condition: template
        value_template: >-
          {{ status_lte == 'down'
             and down_duration_minutes | float >= down_threshold_minutes
             and minutes_since_last_reboot | float >= cooldown_minutes
             and reboot_count_today < max_reboots
             and not is_state('input_boolean.mikrotik_atlgm_lte_watchdog_alert_silenced', 'on')
             and not is_state('input_boolean.mikrotik_atlgm_lte_watchdog_muted', 'on') }}
    action:
      - action: system_log.write
        data:
          message: >-
            [mikrotik_atlgm_lte_watchdog] REBOOT TRIGGERED: attempt={{ attempt_number }}/{{ max_reboots }}
            type={{ 'HARD' if is_hard_attempt else 'SOFT' }} down_duration={{ down_duration_minutes }}min
            (threshold {{ down_threshold_minutes }}min)
          level: warning
          logger: custom.mikrotik_atlgm_lte_watchdog

      - choose:
          # --- Обе кнопки (софт и хард) недоступны одновременно -
          # действие невозможно, не тратим попытку и cooldown впустую.
          # integration_health_monitor уже уведомляет о самом факте
          # недоступности отдельно, здесь только тихо логируем и выходим ---
          - conditions:
              - condition: template
                value_template: "{{ soft_button_unreachable and hard_button_unreachable }}"
            sequence:
              - action: system_log.write
                data:
                  message: >-
                    [mikrotik_atlgm_lte_watchdog] REBOOT SKIPPED: both soft and hard
                    reset buttons unreachable, cannot attempt anything this cycle
                  level: error
                  logger: custom.mikrotik_atlgm_lte_watchdog
        default:
          # --- Сразу фиксируем стадию для LED, до фактического выполнения действия ---
        - action: input_select.select_option
          target:
            entity_id: input_select.mikrotik_atlgm_lte_watchdog_stage
          data:
            option: "{{ 'hard_reset' if is_hard_attempt else 'soft_reset' }}"

        - choose:
            # ---------------- ХАРД-РЕСЕТ (обрыв питания) ----------------
            - conditions:
                - condition: template
                  value_template: "{{ is_hard_attempt }}"
              sequence:
                - action: telegram_bot.send_message
                  data:
                    chat_id: !secret telegram_chat_id
                    message: >-
                      🔌 <b>WAN_LTE_MIKROTIK_DHCP в down {{ down_duration_minutes }} мин</b>
                      Программные перезагрузки не помогли. Выполняю АППАРАТНЫЙ
                      обрыв питания MikroTik ATL LTE18
                      {% if hard_reset_long_minutes > 0 -%}
                      на {{ hard_reset_long_minutes }} мин (короткий обрыв ранее не помог)
                      {% else -%}
                      (стандартная короткая длительность)
                      {% endif -%}...
                      Попытка №{{ attempt_number }} из {{ max_reboots }} на сегодня.
                    parse_mode: html
                # Если этот хард-ресет эскалированный (долгий) - выставляем
                # override в секундах на ESP перед нажатием. Если 0 - ESP
                # сам использует свою стандартную короткую длительность
                # (number.mikrotik_atlgm_hard_reset_duration).
                - action: number.set_value
                  target:
                    entity_id: number.mikrotik_atlgm_hard_reset_override_seconds
                  data:
                    value: "{{ hard_reset_long_minutes * 60 }}"
                - action: button.press
                  target:
                    entity_id: button.mikrotik_atlgm_hard_power_cycle
                  data: {}
          # ---------------- СОФТ-РЕСЕТ (штатная кнопка) ----------------
          default:
            - action: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_id
                message: >-
                  🚨 <b>WAN_LTE_MIKROTIK_DHCP в down {{ down_duration_minutes }} мин</b>
                  Выполняю программную перезагрузку MikroTik ATL LTE18 (192.168.188.1)...
                  Попытка №{{ attempt_number }} из {{ max_reboots }} на сегодня.
                parse_mode: html
            - action: button.press
              target:
                entity_id: button.qtronixlte_restart
              data: {}

        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.mikrotik_atlgm_lte_last_reboot
          data:
            timestamp: "{{ now().timestamp() }}"

        - action: input_number.set_value
          target:
            entity_id: input_number.mikrotik_atlgm_lte_reboot_count_today
          data:
            value: "{{ attempt_number }}"

        # --- Пауза перед проверкой восстановления: короткая после софт-ребута,
        # намного длиннее после хард-ресета (холодная загрузка + LTE-регистрация
        # + собственно время, пока питание было отключено, если хард-ресет
        # долгий - эскалированный) ---
        - delay:
            minutes: "{{ hard_wait_minutes if is_hard_attempt else post_reboot_wait_minutes }}"

        - action: system_log.write
          data:
            message: >-
              [mikrotik_atlgm_lte_watchdog] Post-reboot check ({{ 'HARD' if is_hard_attempt else 'SOFT' }}):
              status={{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') }}
            level: info
            logger: custom.mikrotik_atlgm_lte_watchdog

        - choose:
            # Шлюз реально поднялся -> сообщение о восстановлении.
            # Явно проверяем, что статус НЕ down И НЕ unavailable/unknown -
            # 'unavailable' означает, что сенсор ещё не успел получить
            # свежие данные, а не что шлюз реально работает.
            - conditions:
                - condition: template
                  value_template: >-
                    {{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status')
                       not in ['down', 'unavailable', 'unknown'] }}
              sequence:
                - action: input_select.select_option
                  target:
                    entity_id: input_select.mikrotik_atlgm_lte_watchdog_stage
                  data:
                    option: online
                - action: telegram_bot.send_message
                  data:
                    chat_id: !secret telegram_chat_id
                    message: >-
                      ✅ WAN_LTE_MIKROTIK_DHCP восстановлен после
                      {{ 'аппаратной' if is_hard_attempt else 'программной' }}
                      перезагрузки MikroTik.
                      Текущий статус: <code>{{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') }}</code>
                    parse_mode: html
          # Шлюз всё ещё down (или сенсор unavailable/unknown) -> критическое уведомление
          default:
            - action: input_select.select_option
              target:
                entity_id: input_select.mikrotik_atlgm_lte_watchdog_stage
              data:
                option: "{{ 'police' if attempt_number >= max_reboots else ('hard_reset' if is_hard_attempt else 'soft_reset') }}"
            - action: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_id
                message: >-
                  ❌ <b>КРИТИЧНО</b>: WAN_LTE_MIKROTIK_DHCP всё ещё
                  <code>{{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') }}</code>
                  через {{ hard_wait_minutes if is_hard_attempt else post_reboot_wait_minutes }} мин
                  после {{ 'аппаратной' if is_hard_attempt else 'программной' }} перезагрузки
                  {% if is_hard_attempt and hard_reset_long_minutes > 0 -%}
                  (в т.ч. {{ hard_reset_long_minutes }} мин непосредственно обрыва питания)
                  {% endif -%}.
                  {% if attempt_number < max_reboots -%}
                  Следующая попытка ({{ 'аппаратный обрыв питания' if (attempt_number + 1) >= hard_reset_after_attempt else 'софт-ребут' }})
                  возможна не раньше чем через {{ hard_wait_minutes if is_hard_attempt else soft_cooldown_minutes }} мин.
                  {% else -%}
                  Дневной лимит перезагрузок исчерпан. Похоже на проблему
                  провайдера / SIM / антенны, а не на зависание роутера.
                  Требуется ручная проверка.
                  {% endif %}
                parse_mode: html

  - id: mikrotik_atlgm_lte_watchdog_circuit_breaker
    alias: "LTE Watchdog: лимит перезагрузок исчерпан"
    description: >-
      Если дневной лимит перезагрузок исчерпан, а шлюз всё ещё down - шлёт
      одно дополнительное критическое уведомление (не спамит каждые 5 минут)
      о вероятной проблеме на стороне провайдера, а не роутера.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: template
        value_template: >-
          {{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') == 'down'
             and states('input_number.mikrotik_atlgm_lte_reboot_count_today') | int(0)
                 >= states('input_number.mikrotik_atlgm_lte_watchdog_max_reboots_per_day') | int(5)
             and not is_state('input_boolean.mikrotik_atlgm_lte_watchdog_circuit_breaker_notified', 'on') }}
    action:
      - action: system_log.write
        data:
          message: "[mikrotik_atlgm_lte_watchdog] Circuit breaker: дневной лимит перезагрузок исчерпан"
          level: error
          logger: custom.mikrotik_atlgm_lte_watchdog
      - action: input_select.select_option
        target:
          entity_id: input_select.mikrotik_atlgm_lte_watchdog_stage
        data:
          option: police
      - action: telegram_bot.send_message
        data:
          chat_id: !secret telegram_chat_id
          message: >-
            🛑 <b>LTE Watchdog: авто-перезагрузки приостановлены</b>
            Достигнут суточный лимит перезагрузок MikroTik
            ({{ states('input_number.mikrotik_atlgm_lte_watchdog_max_reboots_per_day') }}),
            а WAN_LTE_MIKROTIK_DHCP всё ещё down.
            Вероятная причина: авария/блокировка на стороне оператора связи,
            а не зависание роутера (например, неоплата SIM).
            Дальнейшие авто-перезагрузки не выполняются до 00:00 или до
            ручного сброса через /mikrotik_reset.
          parse_mode: html
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_circuit_breaker_notified

  - id: mikrotik_atlgm_lte_watchdog_daily_reset
    alias: "LTE Watchdog: сброс счётчика перезагрузок в 00:00"
    description: "Ежесуточный сброс счётчика перезагрузок и флага circuit breaker."
    mode: single
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - action: input_number.set_value
        target:
          entity_id: input_number.mikrotik_atlgm_lte_reboot_count_today
        data:
          value: 0
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_circuit_breaker_notified
      # Лимит свежий - LED больше не должен показывать "police", если только
      # канал не down прямо сейчас (тогда снова просто "degraded")
      - action: input_select.select_option
        target:
          entity_id: input_select.mikrotik_atlgm_lte_watchdog_stage
        data:
          option: >-
            {{ 'degraded' if states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') == 'down' else 'online' }}
      - action: system_log.write
        data:
          message: "[mikrotik_atlgm_lte_watchdog] Суточный счётчик перезагрузок сброшен"
          level: info
          logger: custom.mikrotik_atlgm_lte_watchdog

  # ==========================================================================
  # RECOVERY WATCH
  # Периодически проверяет, не восстановился ли канал сам по себе, пока мы
  # находимся в "ждущем" состоянии - либо после исчерпания дневного лимита
  # (circuit_breaker_notified), либо в долгосрочном мьюте (например, ждали
  # оплаты SIM). Если статус реально стал рабочим - снимает оба флага,
  # обнуляет счётчик и возвращает LED в online, без необходимости ручного
  # /mikrotik_reset.
  # ==========================================================================
  - id: mikrotik_atlgm_lte_watchdog_recovery_watch
    alias: "LTE Watchdog: проверка самостоятельного восстановления"
    description: >-
      Пока активны circuit breaker или долгосрочный мьют, периодически
      проверяет реальный статус шлюза; при восстановлении автоматически
      снимает лимит/мьют и возвращает систему в нормальный режим.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    variables:
      waiting_state: >-
        {{ is_state('input_boolean.mikrotik_atlgm_lte_watchdog_circuit_breaker_notified', 'on')
           or is_state('input_boolean.mikrotik_atlgm_lte_watchdog_muted', 'on') }}
      status_lte: "{{ states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') }}"
      really_online: "{{ status_lte not in ['down', 'unavailable', 'unknown'] }}"
    condition:
      - condition: template
        value_template: "{{ waiting_state and really_online }}"
    action:
      - action: system_log.write
        data:
          message: >-
            [mikrotik_atlgm_lte_watchdog] Recovery watch: канал сам восстановился
            (status={{ status_lte }}), снимаю лимит/мьют
          level: info
          logger: custom.mikrotik_atlgm_lte_watchdog
      - action: input_number.set_value
        target:
          entity_id: input_number.mikrotik_atlgm_lte_reboot_count_today
        data:
          value: 0
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_circuit_breaker_notified
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_muted
      - action: input_select.select_option
        target:
          entity_id: input_select.mikrotik_atlgm_lte_watchdog_stage
        data:
          option: online
      - action: telegram_bot.send_message
        data:
          chat_id: !secret telegram_chat_id
          message: >-
            ✅ WAN_LTE_MIKROTIK_DHCP восстановился самостоятельно
            (статус: <code>{{ status_lte }}</code>).
            Лимит перезагрузок и мьют сняты, авто-мониторинг возобновлён
            в обычном режиме.
          parse_mode: html

  # ==========================================================================
  # INTEGRATION HEALTH MONITOR
  # Отдельный класс проблем: связь HA <-> устройства (интеграция mikrotik
  # или ESP хард-ресета) может пропасть независимо от состояния самого
  # LTE-канала - например, сменили пароль на MikroTik, интеграция потеряла
  # авторизацию, ESP отвалился от Wi-Fi. В этом случае auto_reboot будет
  # "жать кнопку в никуда" впустую. Эта автоматизация явно детектирует такую
  # ситуацию, шлёт отдельное уведомление и не даёт спутать её с проблемой LTE.
  # ==========================================================================
  - id: mikrotik_atlgm_lte_watchdog_integration_health_monitor
    alias: "LTE Watchdog: доступность MikroTik/ESP"
    description: >-
      Проверяет, доступны ли button-сущности софт- и хард-ресета (не
      unavailable/unknown). Если недоступны - это проблема связи HA с
      устройством (пароль, сеть, Wi-Fi ESP), а не с LTE-каналом - шлёт
      отдельное уведомление, отличное от обычных LTE-алертов.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    variables:
      soft_unreachable: >-
        {{ states('button.qtronixlte_restart') in ['unavailable', 'unknown'] }}
      hard_unreachable: >-
        {{ states('button.mikrotik_atlgm_hard_power_cycle') in ['unavailable', 'unknown'] }}
      any_unreachable: "{{ soft_unreachable or hard_unreachable }}"
      already_alerted: "{{ is_state('input_boolean.mikrotik_atlgm_lte_watchdog_integration_alert_sent', 'on') }}"
    action:
      - choose:
          # --- Стало недоступно, ещё не предупреждали ---
          - conditions:
              - condition: template
                value_template: "{{ any_unreachable and not already_alerted }}"
            sequence:
              - action: system_log.write
                data:
                  message: >-
                    [mikrotik_atlgm_lte_watchdog] INTEGRATION UNREACHABLE:
                    soft={{ 'unavailable' if soft_unreachable else 'ok' }}
                    hard={{ 'unavailable' if hard_unreachable else 'ok' }}
                  level: error
                  logger: custom.mikrotik_atlgm_lte_watchdog
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_integration_alert_sent
              - action: telegram_bot.send_message
                data:
                  chat_id: !secret telegram_chat_id
                  message: >-
                    🟣 <b>Внимание: потеряна связь с устройством управления MikroTik</b>
                    {% if soft_unreachable -%}
                    - button.qtronixlte_restart недоступна: интеграция mikrotik
                    не может достучаться до роутера (проверьте пароль/сеть/
                    что интеграция вообще загружена).
                    {% endif %}
                    {% if hard_unreachable -%}
                    - button.mikrotik_atlgm_hard_power_cycle недоступна: ESP
                    хард-ресета не в сети (проверьте питание/Wi-Fi ESP).
                    {% endif %}
                    Это НЕ проблема LTE-канала как такового - это проблема
                    связи Home Assistant с оборудованием. Пока не
                    восстановится, автоматические попытки ремонта LTE-канала
                    могут не сработать даже при реальном сбое.
                  parse_mode: html
              - action: light.turn_on
                target:
                  entity_id: light.mikrotik_atlgm_status_led
                data:
                  effect: "Purple Fast Blink"

          # --- Снова доступно, раньше предупреждали ---
          - conditions:
              - condition: template
                value_template: "{{ not any_unreachable and already_alerted }}"
            sequence:
              - action: system_log.write
                data:
                  message: "[mikrotik_atlgm_lte_watchdog] Integration reachable again"
                  level: info
                  logger: custom.mikrotik_atlgm_lte_watchdog
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_integration_alert_sent
              - action: telegram_bot.send_message
                data:
                  chat_id: !secret telegram_chat_id
                  message: "🟢 Связь с MikroTik/ESP восстановлена, watchdog снова полностью функционален."
                  parse_mode: html

  - id: mikrotik_atlgm_lte_watchdog_telegram_silence
    alias: "LTE Watchdog: Telegram /mikrotik_silence"
    description: >-
      Ручное управление через Telegram-команды: /mikrotik_silence отключает
      уведомления и авто-reboot на 1 час, /mikrotik_reset снимает silence и
      сбрасывает дневной счётчик и circuit breaker (см. отдельную
      автоматизацию mikrotik_atlgm_lte_watchdog_telegram_reset). Требует,
      чтобы бот был добавлен в allowed_chat_ids и подписан на команды.
    mode: single
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: "/mikrotik_silence"
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_alert_silenced
      - action: telegram_bot.send_message
        data:
          chat_id: !secret telegram_chat_id
          message: "🔕 Уведомления и авто-перезагрузка MikroTik отключены на 1 час."
          parse_mode: html
      - delay:
          hours: 1
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_alert_silenced
      - action: telegram_bot.send_message
        data:
          chat_id: !secret telegram_chat_id
          message: "🔔 Watchdog снова активен."
          parse_mode: html

  - id: mikrotik_atlgm_lte_watchdog_telegram_reset
    alias: "LTE Watchdog: Telegram /mikrotik_reset"
    description: >-
      Ручной сброс через Telegram-команду /mikrotik_reset: снимает silence
      и долгосрочный мьют, сбрасывает дневной счётчик перезагрузок и флаг
      circuit breaker, пересчитывает LED-стадию.
    mode: single
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: "/mikrotik_reset"
    action:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_alert_silenced
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_muted
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_circuit_breaker_notified
      - action: input_number.set_value
        target:
          entity_id: input_number.mikrotik_atlgm_lte_reboot_count_today
        data:
          value: 0
      - action: input_select.select_option
        target:
          entity_id: input_select.mikrotik_atlgm_lte_watchdog_stage
        data:
          option: >-
            {{ 'degraded' if states('sensor.fw_village_qtronix_ru_gateway_wan_lte_mikrotik_dhcp_status') == 'down' else 'online' }}
      - action: telegram_bot.send_message
        data:
          chat_id: !secret telegram_chat_id
          message: "♻️ Тревога, мьют и счётчик перезагрузок сброшены вручную."
          parse_mode: html

  # ==========================================================================
  # РУЧНОЙ ДОЛГОСРОЧНЫЙ МЬЮТ
  # В отличие от /mikrotik_silence (авто-снятие через 1 час), этот флаг
  # снимается только вручную (/mikrotik_reset) или автоматически, когда
  # канал сам придёт в норму (см. recovery_watch). Удобно, когда причина
  # проблемы уже известна и решается не быстро (например, оплата SIM).
  # ==========================================================================
  - id: mikrotik_atlgm_lte_watchdog_telegram_mute
    alias: "LTE Watchdog: Telegram /mikrotik_mute"
    description: >-
      Отключает уведомления и авто-действия до восстановления канала или
      команды /mikrotik_reset (в отличие от /mikrotik_silence, без
      автоматического снятия через 1 час).
    mode: single
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: "/mikrotik_mute"
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_muted
      - action: telegram_bot.send_message
        data:
          chat_id: !secret telegram_chat_id
          message: >-
            🔇 Оповещения и авто-перезагрузки MikroTik отключены до
            восстановления канала или команды /mikrotik_reset.
          parse_mode: html

  # ==========================================================================
  # 7. РУЧНОЙ СОФТ-РЕБУТ ПО КОМАНДЕ
  # Немедленно нажимает штатную кнопку перезагрузки MikroTik, минуя все
  # пороги/cooldown/anti-flapping. НЕ увеличивает reboot_count_today и не
  # трогает cooldown - это ручное действие оператора, а не часть авто-логики.
  # ==========================================================================
  - id: mikrotik_atlgm_lte_watchdog_telegram_soft_reset
    alias: "LTE Watchdog: Telegram /mikrotik_soft_reset"
    description: >-
      Ручной немедленный софт-ребут MikroTik по команде /mikrotik_soft_reset,
      в обход всех порогов и anti-flapping (это осознанное действие
      оператора, а не срабатывание авто-логики).
    mode: single
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: "/mikrotik_soft_reset"
    action:
      - action: system_log.write
        data:
          message: "[mikrotik_atlgm_lte_watchdog] MANUAL soft reset requested via Telegram"
          level: warning
          logger: custom.mikrotik_atlgm_lte_watchdog
      - action: input_select.select_option
        target:
          entity_id: input_select.mikrotik_atlgm_lte_watchdog_stage
        data:
          option: soft_reset
      - action: telegram_bot.send_message
        data:
          chat_id: !secret telegram_chat_id
          message: "🔧 Ручной софт-ребут MikroTik (по команде оператора)..."
          parse_mode: html
      - action: button.press
        target:
          entity_id: button.qtronixlte_restart
        data: {}

  # ==========================================================================
  # 8. РУЧНОЙ ХАРД-РЕСЕТ ПО КОМАНДЕ
  # Немедленно запускает аппаратный power-cycle через ESPHome, минуя все
  # пороги. Полезно, если видно, что софт-ребут точно не поможет (например,
  # аналогичный сбой уже случался и известно, что нужен именно обрыв питания).
  # ==========================================================================
  - id: mikrotik_atlgm_lte_watchdog_telegram_hard_reset
    alias: "LTE Watchdog: Telegram /mikrotik_hard_reset"
    description: >-
      Ручной немедленный аппаратный обрыв питания MikroTik через ESPHome
      по команде /mikrotik_hard_reset, в обход всех порогов и anti-flapping.
      Без аргумента - стандартная короткая длительность (см.
      number.mikrotik_atlgm_hard_reset_duration). С числовым аргументом
      в минутах (например, "/mikrotik_hard_reset 10") - обрыв питания на
      указанное число минут, полезно если известно, что короткий обрыв
      конкретно вашей вышке/модему не помогает.
    mode: single
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: "/mikrotik_hard_reset"
    variables:
      # trigger.event.data.args - список аргументов команды, например
      # ["10"] для "/mikrotik_hard_reset 10", или [] без аргумента.
      # int(0) сам возвращает 0, если строка не парсится как число.
      # Ограничиваем диапазон 0-20 мин (совпадает с max_value на ESP) -
      # защита от опечаток вида "/mikrotik_hard_reset 99999".
      requested_minutes: >-
        {% set raw = (trigger.event.data.args[0] | int(0)) if (trigger.event.data.args | length) > 0 else 0 %}
        {% set not_negative = [raw, 0] | max %}
        {{ [not_negative, 20] | min }}
      requested_seconds: "{{ requested_minutes * 60 }}"
    action:
      - action: system_log.write
        data:
          message: >-
            [mikrotik_atlgm_lte_watchdog] MANUAL hard reset requested via Telegram
            (duration_minutes={{ requested_minutes }}, 0=default)
          level: warning
          logger: custom.mikrotik_atlgm_lte_watchdog
      - action: input_select.select_option
        target:
          entity_id: input_select.mikrotik_atlgm_lte_watchdog_stage
        data:
          option: hard_reset
      - action: telegram_bot.send_message
        data:
          chat_id: !secret telegram_chat_id
          message: >-
            🔌 Ручной АППАРАТНЫЙ обрыв питания MikroTik (по команде оператора)...
            {% if requested_minutes > 0 -%}
            Питание будет отключено на {{ requested_minutes }} мин.
            {% else -%}
            Питание будет отключено на
            {{ states('number.mikrotik_atlgm_hard_reset_duration') | default('30-60') }} сек
            (стандартная длительность; укажите число минут после команды,
            например /mikrotik_hard_reset 10, для более долгого обрыва).
            {% endif %}
          parse_mode: html
      # Выставляем override перед нажатием: 0 = использовать стандартную
      # короткую длительность на самой ESP, иначе - запрошенное число минут
      - action: number.set_value
        target:
          entity_id: number.mikrotik_atlgm_hard_reset_override_seconds
        data:
          value: "{{ requested_seconds }}"
      - action: button.press
        target:
          entity_id: button.mikrotik_atlgm_hard_power_cycle
        data: {}

  # ==========================================================================
  # LED SYNC
  # Единая точка управления статусным RGB-светодиодом на ESP32-S3. Реагирует
  # на изменение стадии (online/degraded/soft_reset/hard_reset/police) и на
  # включение/выключение silence/mute, каждый раз пересчитывая финальную
  # картинку заново - так исключается риск, что где-то в другой автоматизации
  # забыли обновить LED и он показывает неактуальное состояние.
  #
  # Приоритет: silence/mute перекрывают всё остальное (жёлтый мигающий),
  # дальше идёт stage по убыванию серьёзности: police > hard_reset >
  # soft_reset > degraded > online.
  # ==========================================================================
  - id: mikrotik_atlgm_lte_watchdog_led_sync
    alias: "LTE Watchdog: синхронизация LED"
    description: >-
      Централизованно обновляет RGB LED на ESP32-S3 (light.mikrotik_atlgm_status_led)
      в соответствии с текущей стадией и флагами silence/mute. Единая точка
      истины для визуальной индикации - все остальные автоматизации только
      меняют input_select/input_boolean, а фактическую команду на LED
      формирует эта автоматизация.
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.mikrotik_atlgm_lte_watchdog_stage
      - platform: state
        entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_alert_silenced
      - platform: state
        entity_id: input_boolean.mikrotik_atlgm_lte_watchdog_muted
      - platform: state
        entity_id: button.qtronixlte_restart
      - platform: state
        entity_id: button.mikrotik_atlgm_hard_power_cycle
      - platform: homeassistant
        event: start
    variables:
      muted_active: >-
        {{ is_state('input_boolean.mikrotik_atlgm_lte_watchdog_alert_silenced', 'on')
           or is_state('input_boolean.mikrotik_atlgm_lte_watchdog_muted', 'on') }}
      integration_unreachable: >-
        {{ states('button.qtronixlte_restart') in ['unavailable', 'unknown']
           or states('button.mikrotik_atlgm_hard_power_cycle') in ['unavailable', 'unknown'] }}
      stage: "{{ states('input_select.mikrotik_atlgm_lte_watchdog_stage') }}"
    action:
      - choose:
          # --- Silence/mute перекрывает всё: жёлтый мигающий раз в 2 сек ---
          - conditions:
              - condition: template
                value_template: "{{ muted_active }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.mikrotik_atlgm_status_led
                data:
                  effect: "Yellow Slow Blink"

          # --- Потеряна связь HA с MikroTik/ESP - отдельная проблема, не
          # связанная с LTE-каналом напрямую, но система не может ничего
          # исправить, пока это не решено (см. integration_health_monitor) ---
          - conditions:
              - condition: template
                value_template: "{{ integration_unreachable }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.mikrotik_atlgm_status_led
                data:
                  effect: "Purple Fast Blink"

          # --- police: канал не поднялся даже после хард-ресетов ---
          - conditions:
              - condition: template
                value_template: "{{ stage == 'police' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.mikrotik_atlgm_status_led
                data:
                  effect: "Police Red Blue"

          # --- hard_reset: эскалировали до обрыва питания ---
          - conditions:
              - condition: template
                value_template: "{{ stage == 'hard_reset' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.mikrotik_atlgm_status_led
                data:
                  effect: "Red Fast Blink"

          # --- soft_reset: идёт программная перезагрузка ---
          - conditions:
              - condition: template
                value_template: "{{ stage == 'soft_reset' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.mikrotik_atlgm_status_led
                data:
                  effect: "None"
                  rgb_color: [255, 0, 0]

          # --- degraded: проблема замечена, но ещё не дошло до перезагрузки ---
          - conditions:
              - condition: template
                value_template: "{{ stage == 'degraded' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.mikrotik_atlgm_status_led
                data:
                  effect: "None"
                  rgb_color: [255, 190, 0]

        # --- online: всё в порядке, зелёный мигающий раз в 2 сек ---
        default:
          - action: light.turn_on
            target:
              entity_id: light.mikrotik_atlgm_status_led
            data:
              effect: "Green Slow Blink"
